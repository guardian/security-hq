version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: "sbt"
    directory: "/"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 7
    ignore:
      # Keep Scala on the 3.3.x LTS line. Ignore major and minor bumps.
      - dependency-name: "org.scala-lang:scala3-library_3"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      scala-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
